<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>take-o.io — production intelligence for film and TV</title>
<meta name="description" content="AI platform that turns screenplays into structured production data. Automatic script breakdown and technical analysis for production companies. Early access.">
<meta property="og:title" content="take-o.io — from script to budget, in minutes">
<meta property="og:description" content="Script breakdown and technical analysis covering the entire screenplay. Scene by scene, line by line.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://take-o.io">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<style>
:root{--t-fast:120ms;--t-base:200ms;--ease:cubic-bezier(.2,0,0,1)}
[data-theme="dark"]{
  --bg:#141413;--fg:#FAF9F5;--fg-soft:#B9B7B0;--fg-mute:#8A8984;
  --line:#262624;--ctl:#3A3A37;--card:#1E1E1C;--card-on:#333330;--pop:#1E1E1C;
  --btn-bg:#FAF9F5;--btn-fg:#141413;--sheet:#FAF9F5;--sheet-ink:#141413;
}
[data-theme="light"]{
  --bg:#FAF9F5;--fg:#141413;--fg-soft:#5A5955;--fg-mute:#8A8984;
  --line:#EDEBE3;--ctl:#D9D6CC;--card:#F5F3EC;--card-on:#FFFFFF;--pop:#FFFFFF;
  --btn-bg:#141413;--btn-fg:#FAF9F5;--sheet:#FFFFFF;--sheet-ink:#141413;
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{font-family:'General Sans',system-ui,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;transition:background var(--t-base) var(--ease),color var(--t-base) var(--ease);display:flex;flex-direction:column;min-height:100%;min-height:100vh;min-height:100dvh}
.mark use{fill:url(#brushed)}
[data-theme="light"] .mark use{fill:url(#oil)}
a{color:inherit}

.nav{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(20px,4vw,52px);flex:none}
.nav .wm-a{display:block;line-height:0}
.nav .wm{height:24px}
.btn{display:inline-block;background:var(--btn-bg);color:var(--btn-fg);border:none;border-radius:10px;padding:10px 19px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;text-decoration:none;transition:opacity var(--t-fast) var(--ease);white-space:nowrap}
.btn:hover{opacity:.88}

.stage{flex:1;display:flex;align-items:center;min-height:0}
.split{width:100%;max-width:1240px;margin:0 auto;padding:0 clamp(20px,4vw,52px);display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(28px,5vw,64px);align-items:center}
@media (max-width:860px){.split{grid-template-columns:1fr;gap:36px;padding-top:8px;padding-bottom:8px}}

.col-l{min-width:0}
h1{font-weight:500;font-size:clamp(27px,3.3vw,42px);line-height:1.16;letter-spacing:-.015em}
.sub{margin-top:18px;font-size:clamp(14.5px,1.4vw,16.5px);line-height:1.6;color:var(--fg-soft);max-width:46ch}
.cta-row{margin-top:28px;display:flex;gap:9px;flex-wrap:wrap;max-width:440px}
.cta-row input{flex:1;min-width:200px;background:transparent;border:1px solid var(--ctl);border-radius:11px;padding:13px 15px;font:inherit;font-size:14.5px;color:var(--fg);outline:none;transition:border-color var(--t-fast) var(--ease)}
.cta-row input::placeholder{color:var(--fg-mute)}
.cta-row input:focus{border-color:var(--fg-mute)}
.cta-row input:focus-visible,.btn:focus-visible,.seg button:focus-visible,.lang-b:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.micro{margin-top:13px;font-size:12.5px;color:var(--fg-mute)}
.legal{margin-top:6px;font-size:11.5px}
.legal a{color:var(--fg-mute);text-decoration:underline;text-underline-offset:2px}
.legal a:hover{color:var(--fg-soft)}
.form-ok{margin-top:16px;font-size:14px;color:var(--fg-soft);display:none;max-width:40ch}

.col-r{min-width:0}
.viz-frame{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,2vw,24px);transition:background var(--t-base) var(--ease)}
.viz-bar{display:flex;gap:5px;margin-bottom:16px}
.viz-bar i{width:8px;height:8px;border-radius:99px;background:var(--ctl);display:block}
.viz-inner{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:clamp(14px,1.8vw,20px);transition:background var(--t-base) var(--ease)}
.sheet{width:98px;flex:none;aspect-ratio:8.5/11;border-radius:2px;background:var(--sheet);padding:9px 8px;border:1px solid var(--line)}
.sheet i{display:block;border-radius:1.2px;background:var(--sheet-ink);transition:opacity .3s var(--ease)}
.sheet .h{height:2.6px;opacity:.5}
.sheet .h.lit{opacity:.85}
.sheet .b{height:1.6px;opacity:.15;margin-top:2.6px}
.sheet .b.lit,.sheet .d.lit{opacity:.4}
.sheet .c{height:2px;opacity:.3;margin:4.6px auto 1.8px;width:24%}
.sheet .c.lit{opacity:.62}
.sheet .d{height:1.6px;opacity:.15;margin:2.6px 0 0 22%}
.viz-in{display:flex;gap:14px;align-items:flex-start}
.rows{flex:1;display:flex;flex-direction:column;gap:6.5px;min-width:0}
.rw{display:flex;align-items:center;gap:8px;height:20px;padding:0 8px;border-radius:5px;border:1.5px solid transparent;opacity:.3;transition:opacity .28s var(--ease)}
.rw.lit{opacity:1}
.rw .nu{font-family:'Courier New',Courier,monospace;font-size:11px}
.rw .lc{height:5px;border-radius:2.5px;opacity:.45}
[data-theme="dark"] .rw.id{background:#FAF9F5}[data-theme="dark"] .rw.id .nu{color:#141413}[data-theme="dark"] .rw.id .lc{background:#141413}
[data-theme="dark"] .rw.ed{border-color:#FAF9F5}[data-theme="dark"] .rw.ed .nu{color:#FAF9F5}[data-theme="dark"] .rw.ed .lc{background:#FAF9F5}
[data-theme="dark"] .rw.en{border-color:#6B6B67}[data-theme="dark"] .rw.en .nu{color:#9A9A96}[data-theme="dark"] .rw.en .lc{background:#9A9A96}
[data-theme="dark"] .rw.in{background:#3A3A37}[data-theme="dark"] .rw.in .nu{color:#B9B7B0}[data-theme="dark"] .rw.in .lc{background:#B9B7B0}
[data-theme="light"] .rw.id{background:#F2F0E8;border-color:#D3D1C7}[data-theme="light"] .rw.id .nu{color:#5F5E5A}[data-theme="light"] .rw.id .lc{background:#5F5E5A}
[data-theme="light"] .rw.ed{background:#EFDFCD;border-color:#DEC5A8}[data-theme="light"] .rw.ed .nu{color:#8A5A32}[data-theme="light"] .rw.ed .lc{background:#8A5A32}
[data-theme="light"] .rw.en{background:#DAE3F2;border-color:#BFCFE6}[data-theme="light"] .rw.en .nu{color:#3B5A8A}[data-theme="light"] .rw.en .lc{background:#3B5A8A}
[data-theme="light"] .rw.in{background:#E4E9D2;border-color:#CBD5AE}[data-theme="light"] .rw.in .nu{color:#5C6B33}[data-theme="light"] .rw.in .lc{background:#5C6B33}
.lg{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;justify-content:center}
.lg span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--fg-mute)}
.lg i{width:12px;height:12px;border-radius:3px;border:1.5px solid transparent;display:block}
[data-theme="dark"] .k-id{background:#FAF9F5}[data-theme="dark"] .k-ed{border-color:#FAF9F5}
[data-theme="dark"] .k-en{border-color:#6B6B67}[data-theme="dark"] .k-in{background:#3A3A37}
[data-theme="light"] .k-id{background:#F2F0E8;border-color:#D3D1C7}[data-theme="light"] .k-ed{background:#EFDFCD;border-color:#DEC5A8}
[data-theme="light"] .k-en{background:#DAE3F2;border-color:#BFCFE6}[data-theme="light"] .k-in{background:#E4E9D2;border-color:#CBD5AE}

@media (prefers-reduced-motion:no-preference){
  .col-l>*{opacity:0;transform:translateY(8px);animation:up .6s var(--ease) forwards}
  .col-l>*:nth-child(2){animation-delay:.07s}.col-l>*:nth-child(3){animation-delay:.14s}
  .col-l>*:nth-child(4){animation-delay:.21s}.col-l>*:nth-child(5){animation-delay:.21s}
  .viz-frame{opacity:0;animation:up-f .7s var(--ease) .28s forwards}
  @keyframes up{to{opacity:1;transform:none}}
  @keyframes up-f{to{opacity:1}}
}

@media (max-width:860px){
  .nav{padding-top:18px;padding-bottom:14px}
  .nav .wm{height:21px}
  .stage{align-items:flex-start}
  .split{padding-top:20px;padding-bottom:36px}
  h1{font-size:clamp(26px,7.4vw,32px)}
  .sub{font-size:15px}
  .cta-row{max-width:none}
  .cta-row input{min-width:0}
  .cta-row .btn{flex:none;width:100%;text-align:center;padding:13px}
  @media (min-width:521px){.cta-row .btn{width:auto}}
  .viz-frame{padding:14px}
  .viz-inner{padding:14px 12px}
  .sheet{width:82px}
  .rw{height:19px}
  footer{padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
}

footer{border-top:1px solid var(--line);padding:16px clamp(20px,4vw,52px);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;flex:none}
.fsym{height:19px;line-height:0}
.copyline{font-size:11.5px;color:var(--fg-mute)}
.controls{display:flex;align-items:center;gap:8px;margin-left:auto}
.seg{display:flex;align-items:center;gap:2px;padding:2px;border-radius:99px;background:var(--card)}
.seg button{display:flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:none;border-radius:99px;background:transparent;cursor:pointer;color:var(--fg-mute)}
.seg button.on{background:var(--card-on);color:var(--fg)}
.seg svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lang{position:relative}
.lang-b{display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:99px;border:1px solid var(--ctl);background:transparent;cursor:pointer;font:inherit;font-size:12px;font-weight:500;color:var(--fg-soft)}
.lang-b .fl{width:13px;height:13px;border-radius:99px;overflow:hidden;display:block}
.dd{display:none;position:absolute;bottom:calc(100% + 8px);right:0;min-width:136px;padding:4px;border-radius:11px;border:1px solid var(--ctl);background:var(--pop);z-index:10}
.dd.open{display:block}
.dd button{display:flex;align-items:center;gap:9px;width:100%;height:31px;padding:0 9px;border:none;border-radius:8px;background:transparent;cursor:pointer;font:inherit;font-size:12px;color:var(--fg);text-align:left}
.dd button:hover{background:var(--card)}
.dd .ck{margin-left:auto;visibility:hidden}
.dd button.on .ck{visibility:visible}
@media (max-width:520px){.copyline{display:none}}

/* --- nav CTA: scroll + highlight --- */
body.cta-focus::before{content:'';position:fixed;inset:0;background:rgba(20,20,19,.58);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:50;pointer-events:auto;animation:ovl-in 280ms var(--ease) forwards}
[data-theme="light"] body.cta-focus::before{background:rgba(250,249,245,.58)}
@keyframes ovl-in{from{opacity:0}to{opacity:1}}
body.cta-focus #waitlist{position:relative;z-index:51}
body.cta-focus #waitlist input:focus{border-color:var(--fg);box-shadow:0 0 0 3px rgba(250,249,245,.18);outline:none}
[data-theme="light"] body.cta-focus #waitlist input:focus{box-shadow:0 0 0 3px rgba(20,20,19,.15)}
</style>

<script>
const I18N = {
  en: {
    cta:"Join waitlist", ph:"your work email",
    h1:"From script to budget. Scene by scene, line by line. In minutes.",
    sub:"With take-o.io, breakdown and technical analysis cover the entire script. Every scene, every element. Less time, less effort. More control over every decision, from page to set.",
    micro:"Early access by invitation · piloting with selected production companies",
    legal:"Privacy Notice",
    ok:"You're on the list. We'll be in touch when the next round of invitations opens.",
    "l-id":"INT · DAY","l-ed":"EXT · DAY","l-en":"EXT · NIGHT","l-in":"INT · NIGHT",
    title:"take-o.io — production intelligence for film and TV",
    desc:"AI platform that turns screenplays into structured production data. Automatic script breakdown and technical analysis for production companies. Early access."
  },
  pt: {
    cta:"Entrar na lista", ph:"seu e-mail de trabalho",
    h1:"Do roteiro ao orçamento. Cena por cena, linha por linha. Em minutos.",
    sub:"Com a take-o.io, a decupagem e a análise técnica cobrem o roteiro inteiro. Cada cena, cada elemento. Menos tempo, menos esforço. Mais controle sobre cada decisão, do papel ao set.",
    micro:"Acesso antecipado por convite · piloto com produtoras selecionadas",
    legal:"Aviso de Privacidade",
    ok:"Você está na lista. Entramos em contato quando abrir a próxima leva de convites.",
    "l-id":"INT · DIA","l-ed":"EXT · DIA","l-en":"EXT · NOITE","l-in":"INT · NOITE",
    title:"take-o.io — inteligência para produção audiovisual",
    desc:"Plataforma de IA que transforma roteiros em dados operacionais de produção. Decupagem automática e análise técnica para produtoras. Acesso antecipado."
  }
};
// Doutrina: site/hero é "momento de impacto" (Manual v2, mapa de aplicações) — não segue o SO por padrão.
// Página única (uma dobra): não fragmenta hero/conteúdo, então dá pra fixar o padrão sem contradição.
// "Sistema" continua disponível como opção manual pra quem preferir seguir o dispositivo.
let lang = localStorage.getItem('lang') || 'en';
let theme = localStorage.getItem('theme') || 'dark';
const mq = window.matchMedia('(prefers-color-scheme: dark)');

function applyLang(){
  const d = I18N[lang];
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  document.title = d.title;
  document.querySelector('meta[name="description"]').setAttribute('content', d.desc);
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = d[e.dataset.i]);
  document.querySelectorAll('[data-i-ph]').forEach(e => e.placeholder = d[e.dataset.iPh]);
  document.getElementById('lang-lb').textContent = lang==='pt' ? 'Português' : 'English';
  document.getElementById('fl-use').setAttribute('href', lang==='pt' ? '#fl-br' : '#fl-us');
  document.querySelectorAll('#dd button').forEach(b => b.classList.toggle('on', b.dataset.l===lang));
}
function applyTheme(){
  const eff = theme==='system' ? (mq.matches ? 'dark' : 'light') : theme;
  document.documentElement.dataset.theme = eff;
  void document.documentElement.offsetHeight; // força reflow — corrige repaint preso em iOS/WebKit
  document.querySelectorAll('.viz-frame,.viz-inner').forEach(el => { el.style.display='none'; void el.offsetHeight; el.style.display=''; });
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.m===theme));
}
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  theme = b.dataset.m; localStorage.setItem('theme', theme); applyTheme();
}));
mq.addEventListener('change', () => { if(theme==='system') applyTheme(); });

const dd = document.getElementById('dd'), lb = document.getElementById('lang-b');
lb.addEventListener('click', e => { e.stopPropagation(); dd.classList.toggle('open'); lb.setAttribute('aria-expanded', dd.classList.contains('open')); });
document.addEventListener('click', () => { dd.classList.remove('open'); lb.setAttribute('aria-expanded','false'); });
document.querySelectorAll('#dd button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.l; localStorage.setItem('lang', lang); applyLang();
}));

document.getElementById('waitlist').addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target, email = form.email.value.trim(), btn = form.querySelector('button');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ form.email.focus(); return; }
  btn.disabled = true; btn.textContent = lang==='pt' ? 'Enviando…' : 'Sending…';
  try { await fetch('/api/subscribe', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, lang})}); } catch(_){}
  form.style.display='none';
  document.querySelector('.micro').style.display='none';
  document.querySelector('.legal').style.display='none';
  document.getElementById('form-ok').style.display='block';
  document.body.classList.remove('cta-focus');
  if (ctaDismiss) { document.body.removeEventListener('click', ctaDismiss); ctaDismiss = null; }
});

// Nav CTA → smooth scroll + highlight email field
var ctaDismiss = null;
document.getElementById('nav-cta').addEventListener('click', function(e) {
  e.preventDefault();
  var form = document.getElementById('waitlist');
  if (form.style.display === 'none') return; // already submitted
  var input = form.querySelector('input[type="email"]');
  if (document.body.classList.contains('cta-focus')) { input.focus(); return; }
  input.scrollIntoView({ behavior: 'smooth', block: 'center' });
  setTimeout(function() {
    input.focus();
    document.body.classList.add('cta-focus');
    ctaDismiss = function(ev) {
      if (!ev.target.closest('#waitlist')) {
        document.body.classList.remove('cta-focus');
        document.body.removeEventListener('click', ctaDismiss);
        ctaDismiss = null;
      }
    };
    document.body.addEventListener('click', ctaDismiss);
  }, 480);
});

applyLang(); applyTheme();

// Loop da ilustração: varredura de leitura linha a linha da folha, gerando a tabela em simultâneo.
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const sheetLines = Array.from(document.querySelectorAll('.sheet i'));
  const rows = Array.from(document.querySelectorAll('.rw'));
  const n = sheetLines.length;
  const STEP = 9;
  const READ = n * STEP;
  const HOLD = 90, CYCLE = READ + HOLD + 30;
  const birth = [3, 5, 7, 9, 11, 13].map(k => k * STEP);
  let t = 0;
  setInterval(() => {
    t = (t + 1) % CYCLE;
    const pos = Math.min(Math.floor(t / STEP), n);
    const on = t < READ + HOLD;
    sheetLines.forEach((e, i) => e.classList.toggle('lit', on && i < pos));
    rows.forEach((e, i) => e.classList.toggle('lit', on && t > birth[i]));
  }, 30);
} else {
  document.querySelectorAll('.rw, .sheet i').forEach(e => e.classList.add('lit'));
}
</script>
